name: ci

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: GitHub Actions static analysis
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Go formatting
        run: ./tasks.ps1 fmt-check
      - name: Go tests
        run: go test ./...
      - name: Go race tests for service, store, and HTTP API
        run: go test -race ./internal/service ./internal/store ./internal/httpapi
      - name: Go vet
        run: go vet ./...
      - name: Go static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 -db https://storage.googleapis.com/go-vulndb ./...
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Audit web dependencies
        working-directory: web
        run: npm audit --audit-level=high
      - name: Vite development proxy tests
        working-directory: web
        run: npm run test:proxy
      - name: Windows end-to-end tests and native build
        working-directory: web
        run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-e2e-results
          path: .e2e-artifacts/
          include-hidden-files: true
