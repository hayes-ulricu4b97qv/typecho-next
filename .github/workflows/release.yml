name: release

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - 'v*'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  package:
    needs: ci
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CGO_ENABLED: "1"
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate tag and build package
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$') {
            throw "Invalid release tag: $env:RELEASE_TAG"
          }
          $tagCommit = (& git rev-parse "$($env:RELEASE_TAG)^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:RELEASE_COMMIT) {
            throw "Release tag does not resolve to the triggering commit. Tag: $tagCommit; event: $env:RELEASE_COMMIT"
          }
          $version = $env:RELEASE_TAG.Substring(1)
          $outputDirectory = Join-Path $env:RUNNER_TEMP 'typecho-next-release'
          ./tasks.ps1 package -Version $version -OutputDirectory $outputDirectory
          if ($LASTEXITCODE -ne 0) {
            throw "Package task exited with code $LASTEXITCODE"
          }
          $archiveName = "typecho-next-v$version-windows-amd64.zip"
          $archivePath = Join-Path $outputDirectory $archiveName
          $checksumPath = Join-Path $outputDirectory 'SHA256SUMS.txt'
          $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText($checksumPath, "$hash  $archiveName`n", [Text.UTF8Encoding]::new($false))
          $buildInfoPath = Join-Path $outputDirectory 'BUILD.txt'
          [IO.File]::WriteAllText($buildInfoPath, "version=$version`ncommit=$env:RELEASE_COMMIT`n", [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: |
            ${{ runner.temp }}/typecho-next-release/*.zip
            ${{ runner.temp }}/typecho-next-release/SHA256SUMS.txt
            ${{ runner.temp }}/typecho-next-release/BUILD.txt
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: ${{ runner.temp }}/typecho-next-release
      - name: Create or update draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $isPrerelease = $env:RELEASE_TAG -match '-'
          $archiveName = "typecho-next-$($env:RELEASE_TAG)-windows-amd64.zip"
          $outputDirectory = Join-Path $env:RUNNER_TEMP 'typecho-next-release'
          $archivePath = Join-Path $outputDirectory $archiveName
          $checksumPath = Join-Path $outputDirectory 'SHA256SUMS.txt'
          $buildInfoPath = Join-Path $outputDirectory 'BUILD.txt'
          foreach ($path in @($archivePath, $checksumPath, $buildInfoPath)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Release artifact is missing: $path"
            }
          }
          $buildManifest = @(Get-Content -LiteralPath $buildInfoPath)
          if ($buildManifest.Count -ne 2 -or $buildManifest[0] -ne "version=$version" -or $buildManifest[1] -ne "commit=$env:RELEASE_COMMIT") {
            throw 'Release artifact BUILD.txt does not match the triggering tag and commit.'
          }
          $archiveHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumContent = (Get-Content -LiteralPath $checksumPath -Raw).Trim()
          if ($checksumContent -ne "$archiveHash  $archiveName") {
            throw 'Release artifact SHA256SUMS.txt does not match the package ZIP.'
          }

          $releaseUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $release = $null
          try {
            $release = Invoke-RestMethod -Uri $releaseUri -Headers $headers
          } catch {
            $statusCode = [int]$_.Exception.Response.StatusCode
            if ($statusCode -ne 404) {
              throw
            }
          }
          if ($null -ne $release) {
            if (-not $release.draft) {
              throw "Release $env:RELEASE_TAG is already published and cannot be replaced."
            }
            if (@($release.assets | Where-Object { $_.name -eq 'BUILD.txt' }).Count -ne 1) {
              throw "Draft release $env:RELEASE_TAG has no unique BUILD.txt manifest and cannot be updated safely."
            }
            $priorBuildDirectory = Join-Path $env:RUNNER_TEMP 'typecho-next-prior-release'
            New-Item -ItemType Directory -Force -Path $priorBuildDirectory | Out-Null
            gh release download $env:RELEASE_TAG --dir $priorBuildDirectory --pattern BUILD.txt
            if ($LASTEXITCODE -ne 0) {
              throw "Could not read the existing BUILD.txt manifest."
            }
            $priorBuild = (Get-Content -LiteralPath (Join-Path $priorBuildDirectory 'BUILD.txt') -Raw).Trim()
            $currentBuild = (Get-Content -LiteralPath $buildInfoPath -Raw).Trim()
            if ($priorBuild -ne $currentBuild) {
              throw "Draft release $env:RELEASE_TAG belongs to a different source commit and cannot be replaced."
            }
            gh release upload $env:RELEASE_TAG $archivePath $checksumPath $buildInfoPath --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Could not upload the verified release artifacts."
            }
            if ([bool]$release.prerelease -ne $isPrerelease) {
              $releaseMetadataUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($release.id)"
              $releaseMetadata = @{ prerelease = $isPrerelease } | ConvertTo-Json -Compress
              Invoke-RestMethod -Uri $releaseMetadataUri -Headers $headers -Method Patch -ContentType 'application/vnd.github+json' -Body $releaseMetadata | Out-Null
            }
          } else {
            if ($isPrerelease) {
              gh release create $env:RELEASE_TAG $archivePath $checksumPath $buildInfoPath --draft --prerelease --verify-tag --generate-notes --title "Typecho Next $env:RELEASE_TAG"
            } else {
              gh release create $env:RELEASE_TAG $archivePath $checksumPath $buildInfoPath --draft --verify-tag --generate-notes --title "Typecho Next $env:RELEASE_TAG"
            }
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release command exited with code $LASTEXITCODE"
          }
